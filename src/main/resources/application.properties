# =========================
# APP
# =========================
spring.application.name=unimatelk

# =========================
# SERVER
# =========================
server.port=8080
server.servlet.session.cookie.same-site=lax

# Limit every multipart image to 5 MiB; content is validated before permanent storage.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB

# =========================
# DATABASE (XAMPP MySQL - default port 3306)
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/unimatelk}
spring.datasource.username=${DB_USERNAME:unimatelk_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# helpful logs
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# =========================
# ACTUATOR (so you can check Flyway ran)
# =========================
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.flyway.access=unrestricted

# =========================
# GOOGLE OAUTH2 (Login)
# =========================

# =========================
# SWAGGER (SPRINGDOC)
# =========================
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# APP SETTINGS
# =========================
app.uploads-dir=./uploads

# Comma-separated admin emails.
app.admin-emails=${ADMIN_EMAILS:}

# Trust & safety
app.report-threshold=5
app.report-window-days=7
